<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kampüs Etkinlikleri — Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/20231047.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header class="site-baslik">
    <h1>Etkinlik Ekle</h1>
  </header>

  <nav class="menu">
    <ul>
      <li><a href="index.html">Ana Sayfa</a></li>
      <li><a href="etkinlikler.html">Etkinlikler</a></li>
      <li><a href="etkinlik-ekle.html" aria-current="page">Ekle</a></li>
    </ul>
  </nav>

  <main>
    <p class="bilgi">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

    <form id="etkinlik-formu" class="form" data-mode="ekle" novalidate>
      <p class="alan">
        <label for="ad">Etkinlik Adı *</label>
        <input type="text" id="ad" name="ad" maxlength="80" placeholder="Örn. Kariyer Günleri 2026" required>
        <span id="ad-hata" class="hata-metni"></span>
      </p>

      <p class="alan">
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori" required>
          <option value="">Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
          <option value="Yarışma">Yarışma</option>
        </select>
        <span id="kategori-hata" class="hata-metni"></span>
      </p>

      <p class="alan">
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih" required>
        <span id="tarih-hata" class="hata-metni"></span>
      </p>

      <p class="alan">
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat" required>
        <span id="saat-hata" class="hata-metni"></span>
      </p>

      <p class="alan">
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer" maxlength="80" placeholder="Örn. A Blok Konferans Salonu" required>
        <span id="yer-hata" class="hata-metni"></span>
      </p>

      <p class="alan">
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
        <span id="kontenjan-hata" class="hata-metni"></span>
      </p>

      <p class="alan">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="5"></textarea>
      </p>

      <p class="form-butonlar">
        <button type="submit" class="buton">Kaydet</button>
      </p>
    </form>

    <div id="form-mesaj" aria-live="polite"></div>
  </main>

  <footer>
    <p>Ad Soyad &middot; 20231047 &middot; 2026</p>
  </footer>

</body>
</html>
